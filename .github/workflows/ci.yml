name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Actions are pinned by commit, tools by exact version: nothing new runs here unreviewed. The runner
      # images bring PowerShell 7.6 and the .NET 10 SDK, which restores the mail libraries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Version '[6.2.0]' -Repository PSGallery -TrustRepository -Quiet
          Install-PSResource -Name PSScriptAnalyzer -Version '[1.25.0]' -Repository PSGallery -TrustRepository -Quiet

      # smtp4dev, a fake mail server, for the tests against a real IMAP server (Tests/Smtp4dev.ps1 starts it
      # on the loopback only). A tool of the tests, never in the package.
      - name: Install smtp4dev
        shell: pwsh
        run: |
          dotnet tool install --global Rnwood.Smtp4dev --version 3.15.0
          Join-Path $HOME .dotnet tools >> $env:GITHUB_PATH

      # Restores the mail libraries (failing on a known vulnerability), parses every script, validates the
      # manifest, runs PSScriptAnalyzer and the Pester tests, stages ./out/ElektoImapPosh and imports it.
      # Without smtp4dev on the PATH, the tests against it would be skipped rather than fail.
      - name: Build and test
        shell: pwsh
        run: |
          Get-Command smtp4dev -CommandType Application -ErrorAction Stop | Out-Null
          ./Build.ps1
